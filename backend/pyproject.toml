[project]
name = "strategy-tournament-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pandas>=2.2.3",
    "numpy>=2.2.0",
    "httpx>=0.28.1",
    "scikit-learn>=1.5.0",
    "alpaca-py>=0.42.0",
    "cryptography>=44",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
